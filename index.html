<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>POSTMAXXERS — Live Ranking</title>
<style>html,body{margin:0;min-height:100%;background:#080a0e;color:#f4f6fb;font:14px system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot strong{font-size:18px}.boot p{color:#98a4b5}</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Loading POSTMAXXERS…</strong><p>Loading the live dashboard.</p></div></div>
<script>
(async()=>{
  const sourceUrl='https://raw.githubusercontent.com/Aeizu29/rank-online/0111bd33569aa51203da939b8d655e9f824ffee2/index.html';
  const response=await fetch(sourceUrl,{cache:'no-store'});
  if(!response.ok) throw new Error(`Could not load dashboard source (HTTP ${response.status}).`);
  let html=await response.text();
  html=html.replace("const branches = unique([config.branch, 'main', 'master']);","const branches = unique([config.branch, 'main']);");
  const fetchReplacement="  async function fetchCandidate(source) {\n    const path = source.dataPath.split('/').filter(Boolean).map(encodeURIComponent).join('/');\n    const url = `https://raw.githubusercontent.com/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/${encodeURIComponent(source.branch)}/${path}`;\n    const response = await fetch(`${url}?_=${Date.now()}`, { cache:'no-store' });\n    if (!response.ok) {\n      throw new Error(`GitHub returned ${response.status} for ${source.branch}/${source.dataPath}`);\n    }\n    const data = await response.json();\n    if (!Array.isArray(data.ranking)) throw new Error('The JSON file does not contain a ranking array.');\n    return { data, source };\n  }\n\n  function renderAll()";
  const fetchPattern=/  async function fetchCandidate\(source\) \{[\s\S]*?\n  \}\n\n  function renderAll\(\)/;
  if(!fetchPattern.test(html)) throw new Error('Could not locate the dashboard GitHub loader.');
  html=html.replace(fetchPattern,fetchReplacement);
  html=html.replace('Tried ranking.json and docs/ranking.json on main/master.','Tried ranking.json and docs/ranking.json on main.');
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  const boot=document.getElementById('boot');
  if(boot) boot.innerHTML=`<div><strong>Could not load POSTMAXXERS</strong><p>${String(error?.message||error)}</p></div>`;
});
</script>
</body>
</html>
